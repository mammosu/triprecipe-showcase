test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 (S3-compatible)
<% if Rails.env.production? %>
r2:
  service: S3
  access_key_id: <%= Rails.env.test? ? ENV.fetch("R2_ACCESS_KEY_ID", "test") : ENV.fetch("R2_ACCESS_KEY_ID") %>
  secret_access_key: <%= Rails.env.test? ? ENV.fetch("R2_SECRET_ACCESS_KEY", "test") : ENV.fetch("R2_SECRET_ACCESS_KEY") %>
  region: <%= Rails.env.test? ? ENV.fetch("R2_REGION", "auto") : ENV.fetch("R2_REGION", "auto") %>
  bucket: <%= Rails.env.test? ? ENV.fetch("R2_BUCKET", "test") : ENV.fetch("R2_BUCKET") %>
  endpoint: <%= Rails.env.test? ? ENV.fetch("R2_ENDPOINT", "http://localhost") : ENV.fetch("R2_ENDPOINT") %>
  force_path_style: true
  # R2 rejects multiple non-default checksums (Active Storage already sends Content-MD5)
  request_checksum_calculation: "when_required"
  response_checksum_validation: "when_required"
<% end %>

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

